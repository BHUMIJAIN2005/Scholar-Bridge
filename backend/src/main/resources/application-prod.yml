spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:20}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ml:
    service-url: ${ML_SERVICE_URL}
  uploads:
    directory: ${SCHOLARBRIDGE_UPLOAD_DIR}
  seed:
    enabled: false
